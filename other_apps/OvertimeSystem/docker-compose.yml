services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: overtime_user
      POSTGRES_PASSWORD: overtime_password
      POSTGRES_DB: overtimedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overtime_user -d overtimedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./OvertimeApi
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=overtimedb;Username=overtime_user;Password=overtime_password
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - api

volumes:
  pgdata: