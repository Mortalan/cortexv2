services:
  redis:
    image: redis:7-alpine
    container_name: redis-automation
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - /mnt/data_lake/automation/redis:/data
    networks:
      - netlock_netlock-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-automation
    restart: always
    environment:
      - N8N_HOST=automation.rmmservice.co.za
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://automation.rmmservice.co.za/
      - QUEUE_BULL_REDIS_HOST=redis
    ports:
      - '5678:5678'
    volumes:
      - /mnt/data_lake/automation/n8n:/home/node/.n8n
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.n8n.rule=Host(`automation.rmmservice.co.za`)'
      - 'traefik.http.routers.n8n.entrypoints=web'
      - 'traefik.http.routers.n8n.middlewares=authelia@docker'
      - 'traefik.http.services.n8n.loadbalancer.server.port=5678'
    networks:
      - netlock_netlock-network
    depends_on:
      - redis

networks:
  netlock_netlock-network:
    external: true
