services:
  dashboard:
    build: .
    container_name: viki-dashboard-react
    restart: always
    volumes:
      - /opt/cortex/status.json:/usr/share/nginx/html/status.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-react.rule=Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)"
      - "traefik.http.routers.dashboard-react.entrypoints=web"
      - "traefik.http.routers.dashboard-react.middlewares=authelia@docker"
      - "traefik.http.services.dashboard-react.loadbalancer.server.port=80"
    networks:
      - netlock_netlock-network

networks:
  netlock_netlock-network:
    external: true
