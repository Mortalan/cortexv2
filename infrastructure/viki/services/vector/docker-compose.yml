services:
  vector:
    image: timberio/vector:0.38.0-debian
    container_name: viki-vector
    restart: always
    ports:
      - "5140:5140"
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/data_lake/logs:/mnt/data_lake/logs
    networks:
      - netlock_netlock-network

networks:
  netlock_netlock-network:
    external: true
