title: "CORTEX"
subtitle: "The Nervous System | Operations Command"
icon: "fas fa-brain"
header: true
footer: '<p>Project CORTEX v2.0 | Secure Sovereign Intelligence</p>'

# Configuration
columns: "3"
connectivity_test: true

# 1. New Tab Behavior
defaults:
  target: "_blank"

# 2. Modern UI Overhaul (Custom CSS)
stylesheet:
  - "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  - |
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(23, 28, 38, 0.7);
      --accent-color: #00d2ff;
      --text-main: #e1e1e1;
      --text-muted: #94a3b8;
    }
    body {
      background: radial-gradient(circle at top right, #1a202c, #0b0e14);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
    }
    .header {
      background: transparent !important;
      padding-top: 3rem;
    }
    .header .title {
      font-size: 3rem !important;
      font-weight: 800 !important;
      letter-spacing: -1px;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--card-bg) !important;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 16px !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
    }
    .card-title {
      color: var(--text-main) !important;
      font-weight: 600 !important;
    }
    .card-subtitle {
      color: var(--text-muted) !important;
      font-size: 0.85rem !important;
    }
    .tag {
      background: rgba(0, 210, 255, 0.1) !important;
      color: var(--accent-color) !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
      text-transform: uppercase;
      font-size: 0.65rem !important;
    }
    .section-title {
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }
    footer {
      opacity: 0.5;
      font-size: 0.8rem;
      margin-top: 4rem;
    }

