services:
  dashboard:
    image: b4bz/homer:latest
    container_name: viki-dashboard
    restart: always
    volumes:
      - /mnt/data_lake/dashboard:/www/assets
    labels:
      - "traefik.enable=false"
    networks:
      - netlock_netlock-network

networks:
  netlock_netlock-network:
    external: true
