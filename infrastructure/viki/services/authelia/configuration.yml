theme: dark
identity_validation:
  reset_password:
    jwt_secret: cortex_secure_jwt_secret_change_me

server:
  address: tcp://0.0.0.0:9091

log:
  level: debug

totp:
  issuer: rmmservice.co.za

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: ["rmmservice.co.za", "*.rmmservice.co.za"]
      policy: one_factor

session:
  name: authelia_session
  same_site: lax
  secret: cortex_secure_session_secret_change_me
  expiration: 1h
  inactivity: 5m
  remember_me: 1M
  cookies:
    - domain: rmmservice.co.za
      # Reverting to HTTPS for Authelia's internal logic
      authelia_url: https://auth.rmmservice.co.za
      default_redirection_url: https://glpi.rmmservice.co.za

storage:
  encryption_key: cortex_secure_storage_encryption_key_change_me
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
