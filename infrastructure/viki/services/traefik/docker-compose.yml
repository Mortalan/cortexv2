services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '8081:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - /mnt/data_lake/logs/traefik:/var/log/traefik
    networks:
      - netlock_netlock-network

networks:
  netlock_netlock-network:
    external: true
