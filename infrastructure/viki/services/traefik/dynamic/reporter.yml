http:
  routers:
    viki-reporter:
      rule: "(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && (PathPrefix(`/api/generate-report`) || PathPrefix(`/api/send-report`))"
      entryPoints:
        - web
      service: viki-reporter-service
      middlewares:
        - authelia@docker

  services:
    viki-reporter-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:9091"
