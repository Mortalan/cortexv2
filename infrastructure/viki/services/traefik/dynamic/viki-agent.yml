http:
  routers:
    viki-agent-endpoints:
      rule: "(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && (PathPrefix(`/api/viki/api/chat`) || PathPrefix(`/api/viki/api/transcribe`))"
      entryPoints:
        - web
      service: viki-agent-service
      middlewares:
        - authelia@docker
        - strip-viki-prefix
      priority: 110

  middlewares:
    strip-viki-prefix:
      stripPrefix:
        prefixes:
          - "/api/viki"

  services:
    viki-agent-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:9092"
