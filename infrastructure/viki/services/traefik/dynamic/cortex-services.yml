http:
  routers:
    # 1. React Dashboard (Main UI)
    dashboard-react:
      rule: "Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)"
      entryPoints:
        - web
      service: dashboard-react-service
      middlewares:
        - authelia@docker
      priority: 1

    # 2. Reflex Daemon API (Protected by Authelia for SSO session mapping)
    reflex-api:
      rule: "(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && PathPrefix(`/api`)"
      entryPoints:
        - web
      service: reflex-api-service
      middlewares:
        - authelia@docker
      priority: 100

    # 2b. Reflex Public Telemetry & Alerts (Bypass Authelia for background log collector agents)
    reflex-telemetry-alerts:
      rule: "(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && (PathPrefix(`/api/telemetry`) || PathPrefix(`/api/alerts`))"
      entryPoints:
        - web
      service: reflex-api-service
      priority: 110

    # 3. Hermès API Gateway
    hermes-api:
      rule: "Host(`hermes.rmmservice.co.za`)"
      entryPoints:
        - web
      service: hermes-api-service
      middlewares:
        - authelia@docker
      priority: 10

    # 4. Hermès Webhook bypass (HMAC verified at application layer)
    hermes-webhook:
      rule: "Host(`hermes.rmmservice.co.za`) && PathPrefix(`/api/hermes/triage`)"
      entryPoints:
        - web
      service: hermes-api-service
      priority: 100

    # 5. MinIO S3 API
    minio-s3:
      rule: "Host(`s3.rmmservice.co.za`)"
      entryPoints:
        - web
      service: minio-s3-service
      priority: 10

    # 6. MinIO Console
    minio-console:
      rule: "Host(`s3-console.rmmservice.co.za`)"
      entryPoints:
        - web
      service: minio-console-service
      middlewares:
        - authelia@docker
      priority: 10

    # 7. Velociraptor EDR (Double-auth wrapping bypassed for native login stability)
    velociraptor-console:
      rule: "Host(`edr.rmmservice.co.za`)"
      entryPoints:
        - web
      service: velociraptor-service
      priority: 10

    # 8. GLPI Ticketing
    glpi:
      rule: "Host(`glpi.rmmservice.co.za`)"
      entryPoints:
        - web
      service: glpi-service
      middlewares:
        - authelia@docker
      priority: 10

    # 9. n8n Automation (Main UI protected by Authelia)
    n8n:
      rule: "Host(`automation.rmmservice.co.za`) && !PathPrefix(`/webhook`)"
      entryPoints:
        - web
      service: n8n-service
      middlewares:
        - authelia@docker
      priority: 10

    # 10. n8n Automation Webhooks (Public access for webhooks)
    n8n-webhook:
      rule: "Host(`automation.rmmservice.co.za`) && PathPrefix(`/webhook`)"
      entryPoints:
        - web
      service: n8n-service
      priority: 100

    # 11. NetLock RMM Web Console (on VM 100)
    netlock-console:
      rule: "Host(`rmm.rmmservice.co.za`) || Host(`nl-webconsole.rmmservice.co.za`)"
      entryPoints:
        - web
      service: netlock-console-service
      priority: 10

    # 12. SEO Scanner Daemon API
    seo-scanner:
      rule: "(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && PathPrefix(`/api/seo`)"
      entryPoints:
        - web
      service: seo-scanner-service
      middlewares:
        - authelia@docker
        - seo-scanner-stripprefix@file
      priority: 120

    # 13. Web Health & Security Auditor Daemon API
    web-auditor:
      rule: "(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && PathPrefix(`/api/audit`)"
      entryPoints:
        - web
      service: web-auditor-service
      middlewares:
        - authelia@docker
        - web-auditor-stripprefix@file
      priority: 120

    # 14. SPIDER SEO Scanner Daemon API & Web Console
    spider:
      rule: "(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && PathPrefix(`/api/spider`)"
      entryPoints:
        - web
      service: spider-service
      middlewares:
        - authelia@docker
        - spider-stripprefix@file
      priority: 120

  middlewares:
    seo-scanner-stripprefix:
      stripPrefix:
        prefixes:
          - "/api/seo"
    web-auditor-stripprefix:
      stripPrefix:
        prefixes:
          - "/api/audit"
    spider-stripprefix:
      stripPrefix:
        prefixes:
          - "/api/spider"

  services:
    dashboard-react-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:80"

    reflex-api-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:9090"

    hermes-api-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:8005"

    minio-s3-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:9000"

    minio-console-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:9001"

    velociraptor-service:
      loadBalancer:
        servers:
          - url: "https://192.168.50.252:8889"

    glpi-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.253:80"

    n8n-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.254:5678"

    netlock-console-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.241:8082"

    seo-scanner-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:8090"

    web-auditor-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:8091"

    spider-service:
      loadBalancer:
        servers:
          - url: "http://192.168.50.252:8092"
