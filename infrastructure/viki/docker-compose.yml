services:
  ollama:
    image: ollama/ollama:0.3.4
    container_name: viki-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - netlock_netlock-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.viki-api.rule=(Host(`cortex.rmmservice.co.za`) || Host(`rmmservice.co.za`)) && PathPrefix(`/api/viki`)"
      - "traefik.http.routers.viki-api.entrypoints=web"
      - "traefik.http.routers.viki-api.middlewares=authelia-authelia@docker,viki-api-stripprefix"
      - "traefik.http.middlewares.viki-api-stripprefix.stripprefix.prefixes=/api/viki"
      - "traefik.http.services.viki-api.loadbalancer.server.port=11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  netlock_netlock-network:
    external: true

volumes:
  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data_lake/ollama
